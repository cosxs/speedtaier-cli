name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 质量检查
        run: scripts/check.sh
      - name: 构建发布包
        run: VERSION="${GITHUB_REF_NAME}" scripts/build.sh
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/checksums-sha256.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
